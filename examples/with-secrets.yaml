# Create the referenced Secret separately. Never put real credentials in Git.
apiVersion: platform.example.io/v1alpha1
kind: AIWorkload
metadata:
  name: secret-demo
  namespace: awcp-workloads
spec:
  image: awcp-demo:v1
  replicas: 1
  container:
    port: 8080
  service:
    enabled: true
    port: 80
  secretRefs:
    - demo-settings
  network:
    enabled: false
