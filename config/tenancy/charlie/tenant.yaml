apiVersion: v1
kind: ConfigMap
metadata:
  name: awcp-tenant-profile
  labels:
    app.kubernetes.io/part-of: ai-workload-control-plane
    platform.example.io/tenant: charlie
data:
  tenant: charlie
  profile: large
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: awcp-tenant-quota
spec:
  hard:
    requests.cpu: "16"
    limits.cpu: "32"
    requests.memory: 32Gi
    limits.memory: 64Gi
    pods: "100"
    services: "60"
    count/configmaps: "120"
    count/secrets: "120"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: awcp-tenant-limits
spec:
  limits:
    - type: Container
      min:
        cpu: 10m
        memory: 32Mi
      max:
        cpu: "4"
        memory: 8Gi
      defaultRequest:
        cpu: 500m
        memory: 512Mi
      default:
        cpu: "2"
        memory: 2Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: awcp-tenant-default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: awcp-tenant-developer
rules:
  - apiGroups: [platform.example.io]
    resources: [aiworkloads]
    verbs: [create, delete, get, list, patch, update, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: awcp-tenant-developer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: awcp-tenant-developer
subjects:
  - kind: Group
    name: awcp:tenant-charlie-developers
    apiGroup: rbac.authorization.k8s.io
