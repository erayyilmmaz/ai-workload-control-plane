apiVersion: v1
kind: ConfigMap
metadata:
  name: awcp-tenant-profile
  labels:
    app.kubernetes.io/part-of: ai-workload-control-plane
    platform.example.io/tenant: alpha
data:
  tenant: alpha
  profile: small
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: awcp-tenant-quota
spec:
  hard:
    requests.cpu: "2"
    limits.cpu: "4"
    requests.memory: 4Gi
    limits.memory: 8Gi
    pods: "10"
    services: "10"
    count/configmaps: "20"
    count/secrets: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: awcp-tenant-limits
spec:
  limits:
    - type: Container
      min:
        cpu: 10m
        memory: 32Mi
      max:
        cpu: "1"
        memory: 1Gi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 512Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: awcp-tenant-default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: awcp-tenant-developer
rules:
  - apiGroups: [platform.example.io]
    resources: [aiworkloads]
    verbs: [create, delete, get, list, patch, update, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: awcp-tenant-developer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: awcp-tenant-developer
subjects:
  - kind: Group
    name: awcp:tenant-alpha-developers
    apiGroup: rbac.authorization.k8s.io
