apiVersion: v1
kind: ConfigMap
metadata:
  name: awcp-tenant-profile
  labels:
    app.kubernetes.io/part-of: ai-workload-control-plane
    platform.example.io/tenant: bravo
data:
  tenant: bravo
  profile: medium
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: awcp-tenant-quota
spec:
  hard:
    requests.cpu: "8"
    limits.cpu: "16"
    requests.memory: 16Gi
    limits.memory: 32Gi
    pods: "40"
    services: "30"
    count/configmaps: "60"
    count/secrets: "60"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: awcp-tenant-limits
spec:
  limits:
    - type: Container
      min:
        cpu: 10m
        memory: 32Mi
      max:
        cpu: "2"
        memory: 4Gi
      defaultRequest:
        cpu: 250m
        memory: 256Mi
      default:
        cpu: "1"
        memory: 1Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: awcp-tenant-default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: awcp-tenant-developer
rules:
  - apiGroups: [platform.example.io]
    resources: [aiworkloads]
    verbs: [create, delete, get, list, patch, update, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: awcp-tenant-developer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: awcp-tenant-developer
subjects:
  - kind: Group
    name: awcp:tenant-bravo-developers
    apiGroup: rbac.authorization.k8s.io
