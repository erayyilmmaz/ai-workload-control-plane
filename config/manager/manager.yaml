apiVersion: apps/v1
kind: Deployment
metadata:
  name: awcp-controller-manager
  namespace: awcp-system
  labels:
    app.kubernetes.io/name: awcp-controller-manager
spec:
  replicas: 1
  # A leader-elected singleton cannot become Ready until the old leader releases
  # its Lease. Delete the old Pod first to avoid a 1-replica rolling-update
  # deadlock where maxUnavailable's default rounds down to zero.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: awcp-controller-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: awcp-controller-manager
    spec:
      serviceAccountName: awcp-controller-manager
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: awcp-manager:awcp-15
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect=true
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8443
          env:
            - name: WATCH_NAMESPACES
              value: awcp-workloads,awcp-tenant-alpha,awcp-tenant-bravo,awcp-tenant-charlie
            - name: MANAGER_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: health
              containerPort: 8081
            - name: metrics
              containerPort: 8443
          volumeMounts:
            - name: metrics-certs
              mountPath: /tmp/k8s-metrics-server/serving-certs
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
      volumes:
        - name: metrics-certs
          emptyDir: {}
