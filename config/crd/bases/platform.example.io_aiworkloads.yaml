                maxLength: 512
                type: string
              observedGeneration:
                description: ObservedGeneration is the CR generation evaluated, not
                  proof of rollout success.
                format: int64
                minimum: 0
                type: integer
              readyReplicas:
                description: ReadyReplicas is the observed Deployment ready count
                  (including possible surge).
                format: int32
                minimum: 0
                type: integer
            type: object
