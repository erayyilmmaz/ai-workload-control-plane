                  permission boundary.
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              health:
                description: Health enables only explicitly present readiness/liveness
                  HTTP probe blocks.
                properties:
                  liveness:
                    description: Liveness detects an unhealthy process; omitted means
                      no liveness probe.
                    properties:
                      path:
                        description: Path must start with /. V0 timing is fixed and
