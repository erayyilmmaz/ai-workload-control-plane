                  pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                  type: string
                maxItems: 32
                type: array
                x-kubernetes-list-type: atomic
                x-kubernetes-validations:
                - message: secretRefs must not contain duplicate names
                  rule: self.all(x, self.filter(y, y == x).size() == 1)
              service:
                default: {}
                description: Service configures an optional ClusterIP Service targeting
                  the named http port.
                properties:
                  enabled:
                    default: true
                    description: Enabled defaults to true; explicit false suppresses
