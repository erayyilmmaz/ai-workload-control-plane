      type: string
    - jsonPath: .spec.replicas
      name: Replicas
      type: integer
    - jsonPath: .spec.image
      name: Image
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: AIWorkload is the Schema for the aiworkloads API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of AIWorkload
            properties:
              container:
                description: Container declares the required HTTP TCP port, named
                  http in generated Pods.
                properties:
                  port:
                    description: Port is required and becomes the TCP container port
                      named http.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                required:
                - port
                type: object
              environment:
                description: |-
                  Environment is an optional logical delivery identity such as dev, staging or
