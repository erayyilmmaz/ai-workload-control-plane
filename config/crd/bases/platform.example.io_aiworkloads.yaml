                      - message: quantity must be parseable and non-negative
                        rule: isQuantity(self) && !quantity(self).isLessThan(quantity('0'))
                    description: Limits caps CPU/memory. A matching request cannot
                      exceed the limit.
                    maxProperties: 2
                    type: object
                    x-kubernetes-validations:
                    - message: only cpu and memory resources are supported
                      rule: self.all(k, k in ['cpu', 'memory'])
                  requests:
                    additionalProperties:
                      description: ResourceQuantity is a quoted Kubernetes quantity,
                        e.g. 100m or 128Mi.
                      maxLength: 64
                      minLength: 1
                      type: string
                      x-kubernetes-validations:
                      - message: quantity must be parseable and non-negative
                        rule: isQuantity(self) && !quantity(self).isLessThan(quantity('0'))
                    description: Requests reserves CPU/memory. Omitted keys remain
                      absent at this API layer.
                    maxProperties: 2
                    type: object
                    x-kubernetes-validations:
                    - message: only cpu and memory resources are supported
                      rule: self.all(k, k in ['cpu', 'memory'])
