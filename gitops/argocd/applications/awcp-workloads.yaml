apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: awcp-workloads
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: ai-workload-control-plane
spec:
  project: awcp-platform
  source:
    repoURL: https://github.com/erayyilmmaz/ai-workload-control-plane.git
    targetRevision: main
    path: gitops/workloads/base
  destination:
    server: https://kubernetes.default.svc
    namespace: awcp-workloads
  syncPolicy:
    automated:
      enabled: true
      # Parent workloads removed from Git are pruned; an empty source is blocked.
      prune: true
      allowEmpty: false
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
        refresh: true
