apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: awcp-workloads
resources:
  - ../../base
nameSuffix: -dev
labels:
  - pairs:
      platform.example.io/environment: dev
      app.kubernetes.io/component: workload
    includeSelectors: false
    includeTemplates: false
patches:
  - target:
      group: platform.example.io
      version: v1alpha1
      kind: AIWorkload
      name: gitops-demo
    patch: |-
      - op: add
        path: /spec/environment
        value: dev
      - op: replace
        path: /spec/replicas
        value: 1
