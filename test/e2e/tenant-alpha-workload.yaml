apiVersion: platform.example.io/v1alpha1
kind: AIWorkload
metadata:
  name: tenant-isolation
  namespace: awcp-tenant-alpha
spec:
  tenant: alpha
  image: awcp-demo:v1
  replicas: 1
  container:
    port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  secretRefs:
    - tenant-only-secret
