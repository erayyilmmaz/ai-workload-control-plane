apiVersion: platform.example.io/v1alpha1
kind: AIWorkload
metadata:
  name: tenant-policy-violation
  namespace: awcp-tenant-alpha
spec:
  tenant: alpha
  policy: baseline
  image: awcp-demo:v1
  container:
    port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  network:
    enabled: true
