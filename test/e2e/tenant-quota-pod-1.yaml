apiVersion: v1
kind: Pod
metadata:
  name: tenant-quota-pod-1
  namespace: awcp-tenant-alpha
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.10
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
      resources:
        requests:
          cpu: "1"
          memory: 64Mi
        limits:
          cpu: "1"
          memory: 64Mi
