apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: awcp-e2e-fake-store
  namespace: awcp-workloads
spec:
  provider:
    fake:
      data:
        - key: /awcp/rotation
          value: AWCP_E2E_ROTATION_V1
          version: v1
        - key: /awcp/rotation
          value: AWCP_E2E_ROTATION_V2
          version: v2
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: awcp-e2e-settings-sync
  namespace: awcp-workloads
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: awcp-e2e-fake-store
    kind: SecretStore
  target:
    name: awcp-e2e-settings
    creationPolicy: Owner
  data:
    - secretKey: rotation-marker
      remoteRef:
        key: /awcp/rotation
        version: v1
