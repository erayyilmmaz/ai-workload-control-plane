apiVersion: platform.example.io/v1alpha1
kind: AIWorkload
metadata:
  name: external-secret-rotation
  namespace: awcp-workloads
spec:
  image: awcp-demo:v1
  replicas: 1
  container:
    port: 8080
  externalSecrets:
    - externalSecret: awcp-e2e-settings-sync
      targetSecret: awcp-e2e-settings
