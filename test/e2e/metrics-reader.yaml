apiVersion: v1
kind: ServiceAccount
metadata:
  name: awcp-e2e-metrics-reader
  namespace: awcp-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: awcp-e2e-metrics-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: awcp-metrics-reader
subjects:
  - kind: ServiceAccount
    name: awcp-e2e-metrics-reader
    namespace: awcp-system
