apiVersion: v1
kind: Pod
metadata:
  name: tenant-limitrange-violation
  namespace: awcp-tenant-alpha
spec:
  restartPolicy: Never
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.10
      resources:
        requests:
          cpu: 2
          memory: 64Mi
        limits:
          cpu: 2
          memory: 64Mi
