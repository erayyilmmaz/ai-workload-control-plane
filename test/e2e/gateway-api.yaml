apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: awcp-e2e-envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: awcp-e2e-proxy
  namespace: awcp-workloads
spec:
  provider:
    type: Kubernetes
    kubernetes:
      # kind has no LoadBalancer controller. A ClusterIP still gives the
      # Gateway a concrete address and keeps the proof reachable by port-forward.
      envoyService:
        type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: awcp-e2e-gateway
  namespace: awcp-workloads
spec:
  gatewayClassName: awcp-e2e-envoy
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: awcp-e2e-proxy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
