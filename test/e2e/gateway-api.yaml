apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: awcp-e2e-envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: awcp-e2e-gateway
  namespace: awcp-workloads
spec:
  gatewayClassName: awcp-e2e-envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
